# Demo inventory — single healthy device (mock TMOS on :18443). Expected: GO.
settings:
  max_workers: 2
  connect_timeout_s: 3
  request_timeout_s: 5
  retries: 1
  verify_tls: false
  output_dir: ./demo-assets/files
devices:
  - name: bigip-a.lab.local
    host: 127.0.0.1
    port: 18443
    roles: [LTM, HA]
    credential: default
    tags: [ha:pair1, active]
profiles:
  quick:
    name: quick
    description: Fast connectivity + version + failover snapshot.
    checks: [system.version, ha.failover-status]
  full:
    name: full
    description: Every system and HA readiness check.
    checks: [system.version, system.license, system.provisioning, system.boot-volumes, ha.failover-status, ha.sync-status]
